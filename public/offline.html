<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuantMind — غير متصل</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #d9dad5; color: #141516;
        font-family: "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif; }
      main { width: min(420px, 100%); padding: 32px 26px; border-radius: 28px; background: #fff; text-align: center; }
      img { width: 64px; height: 64px; border-radius: 50%; }
      h1 { margin: 18px 0 8px; font-size: 22px; font-weight: 500; }
      p { margin: 0 0 22px; color: #54575b; line-height: 1.7; font-size: 14px; }
      button { height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: #141516; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      @media (prefers-color-scheme: dark) { body { background: #060607; color: #f3f4ef; } main { background: #1a1a1d; } p { color: #b0b3b6; } button { background: #f3f4ef; color: #141516; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>مفيش اتصال بالإنترنت</h1>
      <p>أرقام المحفظة بتتحمّل من الخادم مباشرة ومش بتتخزن على الجهاز، فمحتاجين اتصال علشان نعرضها.</p>
      <button type="button" onclick="location.reload()">حاول تاني</button>
    </main>
  </body>
</html>
